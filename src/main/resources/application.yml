spring:
  application:
    name: dev-space-api
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: jdbc:oracle:thin:@localhost:1521:xe
    username: devspace
    password: devspace1234
  jpa:
    database: oracle
    database-platform: org.hibernate.dialect.OracleDialect
    properties:
      hibernate:
        id:
          new_generator_mappings: false
        format_sql: true
    hibernate:
      ddl-auto: update
    generate-ddl: true
    show-sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 16983037515-c9548bkcb6gv383fd31g1s33ktgefkm7.apps.googleusercontent.com
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GOOGLE_MAIL}
    password: ${GOOGLE_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
api:
  naver:
    host: https://openapi.naver.com
    uri: /v1/search/news.json
    client-id: gMvuy5t65gjpfim29RXR
    client-secret: ${NAVER_CLIENT_SECRET} # 환경변수로 관리
    display: 100
    keywords:
      - "IT 통신"
      - "AI"
      - "인공지능"
      - "머신러닝"
      - "딥러닝"
      - "IoT"
      - "ICT"
      - "네트워크"
      - "IT 개발자"
      - "IT 기업"
      - "클라우드 컴퓨팅"
      - "빅데이터"
      - "5G"
      - "자율주행"
      - "블록체인"
      - "사이버 보안"
      - "스마트 시티"
      - "컴퓨터 비전"
      - "자연어 처리"
      - "API 개발"

logging:
  level:
    org.hibernate.SQL: OFF

app:
  upload:
    profile-dir: uploads/profile

jwt:
  key: 2025-kh-dev-space-team-final-project-with-spring-boot
  expiration:
    access: 600000 # 10분
    refresh: 21600000 # 6시간

